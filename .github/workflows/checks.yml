name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit selected by the release workflow
        type: string
        required: false
        default: ''
    outputs:
      artifact_id:
        description: This run's verified portable packages artifact
        value: ${{ jobs.portable.outputs.artifact_id }}
      source_commit:
        description: Commit checked out and packaged
        value: ${{ jobs.portable.outputs.source_commit }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ inputs.source_ref == '' }}

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: test (${{ matrix.runner || matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
        include:
          # Go 1.22's Mach-O linker predates macOS 26's required LC_UUID.
          # Keep minimum-version coverage on maintained macOS 15; latest Go
          # still runs on macos-latest. https://go.dev/issue/78012
          - os: macos-latest
            go: '1.22.x'
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Go race tests and vet
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race ./...
          go vet ./...
      - name: Python Client tests
        run: |
          python -m unittest discover -s clients/tests -v
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: English and Chinese documentation integrity
        run: python tools/check_docs.py
      - name: Node transport and Claude protocol tests
        run: |
          node --test clients/codex/test_desktop_mcp_client.mjs
          node --test clients/claude-code/tests/client.test.mjs

  portable:
    name: portable packages and offline smokes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build four Windows and macOS portable packages
        run: go run ./tools/package
      - name: Legacy, skill sync, mailbox and Grok smokes (zero models)
        run: |
          go build -o "$RUNNER_TEMP/agi-hub-smoke" ./cmd/agi-hub
          python tools/smoke_client.py --hub "$RUNNER_TEMP/agi-hub-smoke"
          python tools/smoke_skill_sync.py --hub "$RUNNER_TEMP/agi-hub-smoke"
          python tools/smoke_mailbox.py --hub "$RUNNER_TEMP/agi-hub-smoke"
          python tools/smoke_grok_client.py --hub "$RUNNER_TEMP/agi-hub-smoke"
      - name: Verify versioned release notes
        run: |
          version=$("$RUNNER_TEMP/agi-hub-smoke" --version | cut -d ' ' -f 3)
          python tools/release_notes.py --tag "v$version" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Record packaged source
        id: source
        run: |
          git rev-parse HEAD > dist/SOURCE-COMMIT
          printf 'commit=%s\n' "$(cat dist/SOURCE-COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Upload verified packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-packages
          path: |
            dist/agi-hub-macos-amd64.zip
            dist/agi-hub-macos-arm64.zip
            dist/agi-hub-windows-amd64.zip
            dist/agi-hub-windows-arm64.zip
            dist/SHA256SUMS
            dist/SOURCE-COMMIT
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Keep this one context stable for main's required status check.
  checks:
    name: checks
    if: always()
    needs: [test, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test and portable build
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PORTABLE_RESULT" = success
