name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on a reviewed main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing tag and main ancestry
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + os.environ['RELEASE_TAG']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=20):
                  raise SystemExit('Release or draft already exists; inspect it manually. Nothing will be overwritten.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ needs.validate.outputs.commit }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
      - name: Verify source, all package checksums and packaged binary version
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          BUILT_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          test "$BUILT_COMMIT" = "$SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path('release-assets')
          packages = {f'agi-hub-{system}-{arch}.zip' for system in ('darwin', 'windows', 'linux') for arch in ('amd64', 'arm64')}
          assert {path.name for path in root.iterdir()} == packages | {'SHA256SUMS', 'SOURCE-COMMIT'}, 'Unexpected or missing artifact files'
          assert (root / 'SOURCE-COMMIT').read_text().strip() == os.environ['SOURCE_COMMIT'], 'Artifact source mismatch'
          seen = set()
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split()
              assert name in packages and name not in seen and re.fullmatch('[0-9a-f]{64}', digest), 'Invalid checksum list'
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, 'Package checksum mismatch'
              seen.add(name)
          assert seen == packages, 'Incomplete checksum list'
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'agi-hub-release-version'
          with zipfile.ZipFile(root / 'agi-hub-linux-amd64.zip') as archive:
              binary.write_bytes(archive.read('agi-hub'))
          binary.chmod(0o700)
          version = subprocess.check_output([str(binary), '--version'], text=True, timeout=10).strip()
          assert version == f"AGI Hub {os.environ['RELEASE_TAG'][1:]} linux/amd64", 'Tag and packaged binary version differ'
          PY
      - name: Create complete draft, then publish
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + os.environ['RELEASE_TAG']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=20):
                  raise SystemExit('Release or draft already exists; inspect it manually. Nothing will be overwritten.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          gh release create "$RELEASE_TAG" release-assets/agi-hub-*.zip release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TAG" --notes "Built and verified by GitHub Actions from $SOURCE_COMMIT. See CHANGELOG.md at this tag for changes."
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
